
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151515">
    <meta name="description" content="デュエル・マスターズ用の対局時計">

    <title>デュエマ対局時計</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./style.css">

    <script src="./script.js" defer></script>
</head>

<body>
<main class="app">

    <!-- 設定画面 -->
    <section id="settingsScreen" class="screen settings-screen">

        <h1>対局時計の設定</h1>

        <p class="settings-description">
            対局の持ち時間を設定してください
        </p>

        <div class="setting-card">
            <h2>持ち時間（各プレイヤー）</h2>

            <div class="time-inputs">
                <div class="input-group">
                    <label for="minutesInput">分</label>
                    <input type="number" id="minutesInput"
                           min="0" max="999" value="10">
                </div>

                <span class="time-colon">:</span>

                <div class="input-group">
                    <label for="secondsInput">秒</label>
                    <input type="number" id="secondsInput"
                           min="0" max="59" value="0">
                </div>
            </div>

            <p class="input-help">
                先攻・後攻それぞれに同じ時間が設定されます
            </p>
        </div>

        <div class="preset-section">
            <h2>時間プリセット</h2>

            <div class="preset-buttons">
                <button class="preset-button" data-minutes="5">5分</button>
                <button class="preset-button selected" data-minutes="10">10分</button>
                <button class="preset-button" data-minutes="15">15分</button>
                <button class="preset-button" data-minutes="20">20分</button>
                <button class="preset-button" data-minutes="30">30分</button>
            </div>
        </div>

        <button id="startButton" class="start-button">
            対局開始
        </button>

    </section>

    <!-- 対局画面 -->
    <section id="clockScreen" class="screen clock-screen hidden">

        <div class="clock-layout">

            <!-- 画面全体のタップ領域 -->
            <button id="turnButton" class="turn-button" type="button">
                <div class="turn-content">

                    <div class="opponent-info">
                        <div id="opponentPlayerName">相手の残り時間</div>
                        <div id="opponentTime" class="opponent-time">10:00</div>
                    </div>

                    <div id="currentTime" class="current-time">
                        10:00
                    </div>

                    <div id="turnStatus" class="turn-status">
                        先攻側をタップして開始
                    </div>

                </div>
            </button>

            <!-- 操作ボタン -->
            <div class="controls">

                <button id="resetButton" type="button">
                    リセット
                </button>

                <button id="pauseButton" type="button">
                    一時停止
                </button>

            </div>

        </div>

    </section>

</main>

<!-- Service Worker登録 -->
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .then(registration => {
                console.log("Service Worker登録成功:", registration.scope);
            })
            .catch(error => {
                console.error("Service Worker登録失敗:", error);
            });
    });
}
</script>

</body>
</html>
